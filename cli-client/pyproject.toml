[project]
name = "aiclub"
version = "0.1.0"
description = "CLI for the university AI & Machine Learning club — verify membership, browse assignments and workshops, and submit code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "supabase>=2.4",
    "platformdirs>=4",
    "httpx>=0.27",
]

[tool.basedpyright]
typeCheckingMode = "standard"

[project.scripts]
aiclub = "aiclub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aiclub"]

[dependency-groups]
dev = [
    "pytest>=8",
]
